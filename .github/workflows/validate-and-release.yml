name: Validate PMO Skills

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python utilities
        run: python -m compileall -q scripts
      - name: Build skill downloads
        run: python scripts/build_zips.py
      - name: Validate skill metadata and downloads
        run: python scripts/validate_release.py
      - name: Save verified downloads
        uses: actions/upload-artifact@v4
        with:
          name: pmo-skills-packages
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build downloads
        run: python scripts/build_zips.py
      - name: Validate release contents
        run: python scripts/validate_release.py
      - name: Publish new version only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; no publication needed."
            exit 0
          fi
          gh release create "$TAG" dist/*.zip dist/pmo-skills-all.md \
            --target "$GITHUB_SHA" \
            --title "PMO Skills $TAG" \
            --generate-notes \
            --latest
